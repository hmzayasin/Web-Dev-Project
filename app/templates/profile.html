{% extends 'base.html' %}{% block title %}My Profile{% endblock %}{% block content %}<section class="auth-area"><div class="panel"><label>APPLICANT PROFILE</label><h1>Your profile.</h1><p>{{ current_user.name }} · {{ current_user.email }}</p><form method="post" enctype="multipart/form-data" class="form"><label>Upload CV (PDF, DOC, DOCX · max 5 MB)<input type="file" name="cv" accept=".pdf,.doc,.docx" required></label><button class="btn">Upload CV ↑</button></form>{% if current_user.cv_filename %}<p>✓ CV uploaded. <a href="{{ url_for('main.private_cv',uid=current_user.id) }}">Download your private CV</a></p>{% else %}<p>No CV uploaded yet.</p>{% endif %}</div></section>{% endblock %}
